{{- if .Values.networkPolicy.enabled }}
{{- $ctx := dict "root" . "component" "networkpolicy" "tag" .Chart.AppVersion }}
# Default-deny: выбирает ВСЕ поды namespace (и будущие) и не разрешает ничего.
# Всё нужное открывают отдельные allow-политики — матрица в README, Часть 3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shop.fullname" . }}-default-deny
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
