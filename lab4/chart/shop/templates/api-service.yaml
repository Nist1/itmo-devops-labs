{{- $ctx := dict "root" . "component" "api" "tag" .Values.api.tag }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" . }}-api
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shop.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
