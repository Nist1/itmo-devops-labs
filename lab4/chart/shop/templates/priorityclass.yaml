{{- range $key, $pc := .Values.priority }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $pc.name }}
  labels:
    {{- include "shop.labels" (dict "root" $ "component" $key "tag" "priority") | nindent 4 }}
value: {{ $pc.value }}
globalDefault: false
description: {{ $pc.description | quote }}
{{- end }}
