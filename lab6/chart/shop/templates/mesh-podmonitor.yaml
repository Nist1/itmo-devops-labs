{{- if and .Values.monitoring.enabled .Values.mesh.enabled }}
{{- $ctx := dict "root" . "component" "monitoring" "tag" .Chart.AppVersion }}
# Лаба 6: метрики sidecar'ов Linkerd (порт linkerd-admin :4191) со всех подов релиза в mesh.
# Прокси сам ничего не знает о версии api — метку version берём из метки пода.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "shop.fullname" . }}-linkerd-proxy
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      # Метку ставит proxy-injector на каждый под с sidecar
      - key: linkerd.io/control-plane-ns
        operator: Exists
  podMetricsEndpoints:
    - port: linkerd-admin
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: app
        - sourceLabels: [__meta_kubernetes_pod_label_version]
          targetLabel: version
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
{{- end }}
