{{- if .Values.monitoring.enabled }}
{{- $ctx := dict "root" . "component" "monitoring" "tag" .Chart.AppVersion }}
# Один ServiceMonitor на оба сервиса: выбирает Service api и worker этого релиза.
# Prometheus из стека Лабы 2 подхватывает его без метки release (serviceMonitorSelectorNilUsesHelmValues: false).
# Цепочка: ServiceMonitor → Service → EndpointSlice → Prometheus скрейпит каждый под напрямую.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "shop.fullname" . }}
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: {{ .Values.partOf }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api, worker, batch, loadgen, gate]
      # Лаба 6: Service shop-api-v1/v2 смотрят на те же поды — без этого api скрейпился бы дважды
      - key: version
        operator: DoesNotExist
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
{{- end }}
