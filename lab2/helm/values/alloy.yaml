# grafana/alloy — агент сбора логов, DaemonSet (по поду на каждой ноде)
# helm install alloy grafana/alloy -n monitoring -f alloy.yaml

controller:
  type: daemonset

alloy:
  mounts:
    varlog: true                 # hostPath /var/log ноды → в под (там /var/log/pods)
    dockercontainers: false      # runtime containerd пишет файлы прямо в /var/log/pods, без симлинков
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    create: true
    content: |-
      // 1. Какие поды есть на МОЕЙ ноде (HOSTNAME чарт выставляет = spec.nodeName)
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // 2. Метаданные пода → метки потока Loki + путь к файлу лога на ноде
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // /var/log/pods/<ns>_<pod>_<uid>/<container>/<N>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      // 3. Раскрыть glob в реальные файлы и читать их (tail)
      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // 4. Разбор строк
      loki.process "pods" {
        // Снять обёртку рантайма: containerd пишет в формате CRI
        // "<время> stdout F <строка приложения>"
        stage.cri {}

        // Только для нашего сервиса: он пишет JSON
        stage.match {
          selector = "{app=\"api\"}"

          stage.json {
            expressions = {
              level    = "level",
              trace_id = "trace_id",
            }
          }
          // level — низкая кардинальность → можно в метку потока
          stage.labels {
            values = { level = "" }
          }
          // trace_id — уникален на каждый запрос → НЕ метка, а structured metadata
          stage.structured_metadata {
            values = { trace_id = "" }
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      // 5. Отправка в Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
