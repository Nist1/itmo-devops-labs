# grafana/loki — один процесс (SingleBinary), хранение на локальном диске
# helm install loki grafana/loki -n monitoring -f loki.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false            # без multi-tenancy: не нужен заголовок X-Scope-OrgID
  commonConfig:
    replication_factor: 1       # одна реплика — некому реплицировать
  storage:
    type: filesystem             # чанки и индекс на PVC, без S3/MinIO
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13              # v13 нужен для structured metadata (trace_id)
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    retention_period: 48h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Компоненты распределённого режима — выключены
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false                 # nginx перед Loki не нужен, ходим напрямую на :3100
chunksCache:
  enabled: false                 # memcached — лишние 1-2 GB RAM
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
