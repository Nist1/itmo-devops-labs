apiVersion: v1
kind: Pod
metadata:
  name: violation-no-limits
  namespace: shop
  labels:
    app.kubernetes.io/name: violation-no-limits
    app.kubernetes.io/part-of: shop
spec:
  containers:
    - name: api
      image: registry.local/shop/api:0.1.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false

