apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ownership-labels
  annotations:
    policies.kyverno.io/description: >-
      Под обязан иметь метки app.kubernetes.io/name (что это) и
      app.kubernetes.io/part-of (к какой системе относится).
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno, monitoring, local-path-storage, cnpg-system]
  # Autogen переписывает object.metadata на object.spec.template.metadata:
  # проверяются метки ШАБЛОНА пода, а не самого Deployment.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  validations:
    # has(): у пода совсем без меток поля labels нет, обращение к нему — ошибка CEL.
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        'app.kubernetes.io/part-of' in object.metadata.labels
      message: "Нужны метки app.kubernetes.io/name и app.kubernetes.io/part-of."
