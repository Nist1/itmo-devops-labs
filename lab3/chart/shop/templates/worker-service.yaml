{{- $ctx := dict "root" . "component" "worker" "tag" .Values.worker.tag }}
# У worker нет входящего трафика от клиентов; Service нужен для /metrics (ServiceMonitor, Часть 5)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" . }}-worker
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shop.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.worker.port }}
      targetPort: http
